name: Backend CI & Deploy

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . \
            -path "./node_modules" -prune -o \
            -path "./.git" -prune -o \
            -name "*.js" \
            -type f \
            -print0 | xargs -0 -n1 node --check

  deploy-staging:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy staging backend
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            cd /var/www/vision-career/backend

            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            npm ci

            pm2 restart vision-career-backend --update-env
            pm2 save
          EOF

  deploy-production:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production backend
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            cd /var/www/vision-career/backend

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            npm ci

            pm2 restart vision-career-backend --update-env
            pm2 save
          EOF